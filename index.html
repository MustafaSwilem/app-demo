<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Travel Website</title>
    <link rel="stylesheet" href="Pro.css">
    
</head>
<body>

    <header>
        <h1>Explore The World</h1>
    </header>

    <!-- Destinations Section -->
    <section>
        <h2>Destinations</h2>
        <div class="destinations">
            <div class="card">
                <img src="images/pexels-asadphoto-28843952.jpg" />
                <h3>Maldives</h3>
            </div>
            <div class="card">
                <img src="images/pexels-rafaelf1-1060791.jpg" />
                <h3>Paris</h3>
            </div>
            <div class="card">
                <img src="images/japan-4141578_1280 (1).jpg" />
                <h3>Tokyo</h3>
            </div>
        </div>
    </section>

    <!-- Offers Section -->
    <section class="offers">
        <h2>Special Offers</h2>
        <p>Get 30% off on your first international trip. Enjoy premium hotels, fast flights, and memorable destinations.</p>
        <button class="btn">Book Now</button>
    </section>

    <!-- Contact Section -->
    <section>
        <h2>Contact Us</h2>
        <div class="contact">
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Email Address">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button class="btn">Send Message</button>
        </div>
    </section>

    <footer>
        © 2025 Travel Website | All Rights Reserved
    </footer>

</body>
</html>
